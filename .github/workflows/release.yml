name: Phát hành DailyTool

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Khớp tag với phiên bản trong mã
        shell: python
        run: |
          import os, re, pathlib, sys
          text = pathlib.Path("dailytool/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else ""
          found = match.group(1) if match else ""
          if found != version:
              sys.exit(f"Tag {tag} không khớp __version__ {found}. Sửa dailytool/__init__.py rồi gắn tag lại.")

      - name: Đóng gói DailyTool.exe
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean DailyTool.spec

      - name: Gắn file vào Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DailyTool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
